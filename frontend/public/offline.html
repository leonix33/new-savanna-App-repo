<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c0f0a" />
    <title>Offline - Savannah BBQ</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #110b07;
        color: #fff7ed;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(249, 115, 22, 0.18), transparent 34rem),
          linear-gradient(135deg, #110b07 0%, #1a100b 45%, #0c0806 100%);
      }

      main {
        width: min(32rem, calc(100vw - 2rem));
        border: 1px solid rgba(154, 52, 18, 0.45);
        border-radius: 1.5rem;
        background: rgba(0, 0, 0, 0.28);
        padding: 2rem;
      }

      p:first-child {
        margin: 0;
        color: #fdba74;
        font-size: 0.75rem;
        font-weight: 900;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.75rem 0;
        font-size: clamp(2rem, 8vw, 3.25rem);
        line-height: 1;
      }

      p {
        color: rgba(255, 237, 213, 0.74);
        line-height: 1.7;
      }

      button {
        border: 0;
        border-radius: 1rem;
        background: #f97316;
        color: white;
        cursor: pointer;
        font-weight: 800;
        margin-top: 1rem;
        padding: 0.8rem 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Savannah BBQ</p>
      <h1>You are offline</h1>
      <p>
        The app shell is available, but live dashboard data, login, AI generation, comments, and queue updates need an
        internet connection.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
