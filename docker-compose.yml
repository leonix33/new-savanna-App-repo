services:
  app:
    build:
      context: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/savannah-bbq
      JWT_ACCESS_SECRET: docker_access_secret_change_me_12345
      JWT_REFRESH_SECRET: docker_refresh_secret_change_me_12345
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SECURE: "false"
      ADMIN_NAME: Savannah Admin
      ADMIN_EMAIL: admin@savannahbbq.local
      ADMIN_PASSWORD: ChangeMe123!
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your_openai_api_key_here}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4o-mini}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o-mini}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-your_facebook_page_id_here}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-your_page_access_token_here}
      FACEBOOK_GRAPH_VERSION: ${FACEBOOK_GRAPH_VERSION:-v20.0}
      INSTAGRAM_BUSINESS_ID: ${INSTAGRAM_BUSINESS_ID:-your_instagram_business_id_here}
      TIKTOK_BUSINESS_ID: ${TIKTOK_BUSINESS_ID:-your_tiktok_business_id_here}
      AUTO_PUBLISH_MODE: "false"
      LIVE_FACEBOOK_MODE: "false"
      LIVE_SOCIAL_PUBLISHING: "false"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
